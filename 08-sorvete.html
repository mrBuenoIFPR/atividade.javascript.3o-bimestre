<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Questão 8</title>
</head>
<body>
    <input type="text" id="sabor" placeholder="Digite um sabor de sorvete">

    <p id="resposta"></p>

    <script>
        const campo = document.getElementById("sabor");
        const resposta = document.getElementById("resposta");

        campo.addEventListener("input", function() {
            const texto = campo.value.toLowerCase();

            if (texto.length > 3) {
                if (texto.includes("chocolate")) {
                    resposta.textContent = "Eu amo sorvete de chocolate!";
                } else if (texto.includes("flocos")) {
                    resposta.textContent = "Ahh, mas chocolate é o meu favorito...";
                } else {
                    resposta.textContent = "Ahh, eu esperava um sabor de sorvete...";
                }
            } else {
                resposta.textContent = "";
            }
        });
    </script>
</body>
</html>
